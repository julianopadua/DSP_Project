<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma simplificado das etapas aplicadas no notebook</title>
  <desc id="desc">Fluxo em S com as principais etapas: carregar dados, selecionar janela, filtrar, comparar, analisar, extrair atributos, treinar e avaliar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#shadow); }
      .box.main { stroke: #2563eb; }
      .num { fill: #2563eb; font: 700 16px Arial, sans-serif; }
      .txt { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .sub { fill: #475569; font: 13px Arial, sans-serif; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1160" height="420" rx="18"/>

  <rect class="box main" x="45" y="55" width="210" height="90" rx="10"/>
  <text class="num" x="70" y="88">01</text>
  <text class="txt" x="70" y="113">Carregar ECG</text>
  <text class="sub" x="70" y="133">MIT-BIH, canal MLII</text>

  <rect class="box" x="325" y="55" width="210" height="90" rx="10"/>
  <text class="num" x="350" y="88">02</text>
  <text class="txt" x="350" y="113">Escolher janela</text>
  <text class="sub" x="350" y="133">4 batimentos</text>

  <rect class="box" x="605" y="55" width="210" height="90" rx="10"/>
  <text class="num" x="630" y="88">03</text>
  <text class="txt" x="630" y="113">Filtrar sinal</text>
  <text class="sub" x="630" y="133">FIR: HP, notch e LP</text>

  <rect class="box" x="885" y="55" width="210" height="90" rx="10"/>
  <text class="num" x="910" y="88">04</text>
  <text class="txt" x="910" y="113">Comparar</text>
  <text class="sub" x="910" y="133">original vs filtrado</text>

  <rect class="box" x="885" y="255" width="210" height="90" rx="10"/>
  <text class="num" x="910" y="288">05</text>
  <text class="txt" x="910" y="313">Analisar</text>
  <text class="sub" x="910" y="333">PSD, STFT e Gabor</text>

  <rect class="box" x="605" y="255" width="210" height="90" rx="10"/>
  <text class="num" x="630" y="288">06</text>
  <text class="txt" x="630" y="313">Extrair features</text>
  <text class="sub" x="630" y="333">por batimento</text>

  <rect class="box" x="325" y="255" width="210" height="90" rx="10"/>
  <text class="num" x="350" y="288">07</text>
  <text class="txt" x="350" y="313">Treinar SVM</text>
  <text class="sub" x="350" y="333">normal vs anomalo</text>

  <rect class="box main" x="45" y="255" width="210" height="90" rx="10"/>
  <text class="num" x="70" y="288">08</text>
  <text class="txt" x="70" y="313">Avaliar</text>
  <text class="sub" x="70" y="333">precision, recall e F1</text>

  <path class="line" d="M 255 100 H 315"/>
  <path class="line" d="M 535 100 H 595"/>
  <path class="line" d="M 815 100 H 875"/>
  <path class="line" d="M 990 145 V 245"/>
  <path class="line" d="M 885 300 H 825"/>
  <path class="line" d="M 605 300 H 545"/>
  <path class="line" d="M 325 300 H 265"/>
</svg>
